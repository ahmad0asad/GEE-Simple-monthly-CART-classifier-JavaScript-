<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CART Classifier - Google Earth Engine</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f6f8fa; }
    pre { background: #1e1e1e; color: #fff; padding: 20px; border-radius: 10px; overflow-x: auto; }
    h1 { color: #007acc; }
  </style>
</head>
<body>
  <h1>GEE Simple Monthly CART Classifier (JavaScript)</h1>
  <p>This page displays the JavaScript code for a CART classifier implementation in Google Earth Engine.</p>
  <pre id="code"></pre>

  <script src="CART.js"></script>
  <script>
    fetch('CART.js')
      .then(response => response.text())
      .then(text => document.getElementById('code').textContent = text)
      .catch(err => console.error(err));
  </script>
</body>
</html>
